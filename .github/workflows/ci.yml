name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python compile check
        run: |
          python3 -m py_compile unitree_robot_control_suite.py go2w_camera_viewer.py
          if [ -d inspire_hand ]; then
            find inspire_hand -name '*.py' -print0 | xargs -0 -r python3 -m py_compile
          fi

      - name: Shell syntax check
        run: |
          bash -n install.sh
          bash -n connect_inspire_hand.sh
          bash -n scripts/verify_installation.sh
          bash -n scripts/install-desktop.sh

      - name: Sync tags to HEAD
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git tag -fa latest -m "Latest main"
          git push origin refs/tags/latest --force
          VERSION=""
          if [ -f app/build.gradle.kts ]; then
            VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\([^"]*\)".*/\1/')
          elif [ -f package.json ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          if [ -n "$VERSION" ]; then
            git tag -fa "v${VERSION}" -m "Release v${VERSION}"
            git push origin "refs/tags/v${VERSION}" --force
          fi
