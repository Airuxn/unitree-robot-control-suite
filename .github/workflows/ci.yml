name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify inspire_hand submodule
        run: test -f inspire_hand/README.md || test -n "$(find inspire_hand -name '*.py' -print -quit)"

      - name: Python compile check
        run: |
          python3 -m py_compile unitree_robot_control_suite.py go2w_camera_viewer.py
          find inspire_hand -name '*.py' -print0 | xargs -0 -r python3 -m py_compile

      - name: Shell syntax check
        run: |
          bash -n install.sh
          bash -n connect_inspire_hand.sh
          bash -n scripts/verify_installation.sh
          bash -n scripts/install-desktop.sh

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error install.sh connect_inspire_hand.sh scripts/verify_installation.sh scripts/install-desktop.sh

      - name: Run tests with coverage
        run: |
          pip install pytest pytest-cov
          pytest tests/ --cov=. --cov-report=xml --cov-report=term -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
